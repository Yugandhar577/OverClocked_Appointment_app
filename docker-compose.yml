services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appointments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: .
      dockerfile: SRC/Backend/Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/appointments
      SMTP_HOST: mailhog
      # Override with your real Google OAuth client ID to enable Google sign-in
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      # Serve current repo sources without rebuilding after every backend change.
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn SRC.Backend.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    build:
      context: SRC/Frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_APP_NAME: OverClocked Appointments
      # Override with your real Google OAuth client ID to enable Google sign-in
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "5173:5173"
    volumes:
      # Mount local sources so UI changes appear without rebuilding the image.
      - ./SRC/Frontend:/app
      # Isolate node_modules inside the container so host OS differences don't interfere.
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  # One-off demo users + sample data (run after postgres is up). Clears auth-related tables.
  # Usage: docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: SRC/Backend/Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/appointments
    volumes:
      - .:/app
    working_dir: /app
    command: ["sh", "-c", "alembic upgrade head && python SRC/Backend/scripts/seed_test_data.py"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
