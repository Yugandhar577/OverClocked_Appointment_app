services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: appt
      POSTGRES_PASSWORD: appt_secret
      POSTGRES_DB: appt_db
    ports:
      - "5435:5432"
    volumes:
      - payments_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appt -d appt_db"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  payments_pg_data:
